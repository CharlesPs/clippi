[package]
name = "lan-clipboard-sync"
version = "0.1.0"
description = "LAN clipboard synchronization MVP"
authors = ["you"]
edition = "2021"

[lib]
name = "lan_clipboard_sync_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3.4"
dirs = "5"
futures-util = "0.3"
local-ip-address = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "fs"] }
tokio-tungstenite = "0.24"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
gdk = "0.18"
glib = "0.18"
gtk = "0.18"
gtk-sys = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
